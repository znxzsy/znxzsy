      <rect x="276" width="108" height="42" rx="11" fill="none" stroke="#e3a94f" stroke-width="2"/>
      <text x="330" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="750" fill="#ffe2aa">RLHF</text>
